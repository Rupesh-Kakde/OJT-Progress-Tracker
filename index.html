
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>OJT Progress Tracker</title>

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container">

<header>

<h1>
OJT Progress Tracker
</h1>

<p>
Track daily OJT work and learning
</p>

</header>

<section class="task-form">

<h2>
Add Task
</h2>

<input
id="taskInput"
type="text"
placeholder="Enter Task Title">

<select id="categorySelect">

<option value="Frontend">
Frontend
</option>

<option value="Backend">
Backend
</option>

<option value="Database">
Database
</option>

</select>

<input
type="date"
id="dateInput">

<button id="addTaskBtn">

Add Task

</button>

</section>

<section class="summary">

<div class="card">

<h3>Total</h3>

<p>0</p>

</div>

<div class="card">

<h3>Completed</h3>

<p>0</p>

</div>

<div class="card">

<h3>Pending</h3>

<p>0</p>

</div>

</section>

<section class="tasks">

<div class="task-header">

<h2>
Task List
</h2>

<select id="filterSelect">

<option value="All">
All
</option>

<option value="Frontend">
Frontend
</option>

<option value="Backend">
Backend
</option>

<option value="Database">
Database
</option>

</select>

</div>

<div id="taskList">

<p class="empty">
No Tasks Found
</p>

</div>

</section>

<section class="notes">

<h2>
Notes
</h2>

<textarea
placeholder="Write today's learning">
</textarea>

</section>

</div>

<script src="js/script.js">
</script>

</body>

</html>
